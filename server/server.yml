# TrustOfBetray Dedicated Online Server Configuration
# Compatible with Pterodactyl Panel & Local Hosting (default 0.0.0.0:12123)

server:
  host: "0.0.0.0"
  port: 12123
  public_address: ""

match:
  max_players: 15
  max_party_size: 5
  bot_fill_timeout_seconds: 300
  fill_bots_on_start: true

logging:
  print_client_ip: true
